<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Name</title> <!-- ✏️ Change to your name -->
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            scroll-behavior: smooth;
        }
        nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: white;
            border-bottom: 1px solid #ddd;
            padding: 10px 20px;
            display: flex;
            justify-content: flex-end;
            gap: 20px;
            z-index: 1000;
        }
        nav a {
            text-decoration: none;
            color: black;
            font-weight: bold;
        }
        section {
            height: 100vh;
            padding: 80px 20px;
        }
        #home { background: #f7f7f7; }
        #about { background: #e3f2fd; }
        #projects { background: #fff9c4; }
        #contact { background: #ffecb3; }
    </style>
</head>
<body>
    <nav>
        <!-- Navigation menu -->
        <a href="#home">Home</a>
        <a href="#about">About</a>
        <a href="#projects">Projects</a>
        <a href="#contact">Contact</a>
    </nav>

    <section id="home">
        <h1>Your Name</h1> <!-- ✏️ Change to your name -->
        <p>Welcome to my personal website.</p> <!-- ✏️ Edit intro -->
    </section>

    <section id="about">
        <h2>About Me</h2>
        <p>Write a short bio about yourself here.</p> <!-- ✏️ Edit bio -->
    </section>

    <section id="projects">
        <h2>Projects</h2>
        <ul>
            <li>Project 1 - description</li> <!-- ✏️ Edit -->
            <li>Project 2 - description</li> <!-- ✏️ Edit -->
            <li>Project 3 - description</li> <!-- ✏️ Edit -->
        </ul>
    </section>

    <section id="contact">
        <h2>Contact</h2>
        <p>Email: your@email.com</p> <!-- ✏️ Edit email -->
        <p>Social: <a href="#">Twitter</a>, <a href="#">LinkedIn</a></p> <!-- ✏️ Edit links -->
    </section>
</body>
</html>
